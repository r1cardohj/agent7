[project]
name = "agent7"
version = "0.3.7"
description = "The simplest coding agent — six tools, one loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "r1cardohj", email = "2413302357@qq.com" },
]
keywords = [
    "agent",
    "coding-agent",
    "cli",
    "llm",
    "deepseek",
    "kimi",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "agent0-runtime[all]>=0.1.2,<0.2",
    "openai>=1.40.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "fzp>=0.2.3",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/r1cardohj/agent7"
Repository = "https://github.com/r1cardohj/agent7"
Issues = "https://github.com/r1cardohj/agent7/issues"

[project.scripts]
agent7 = "agent7.cli:main"

[tool.ruff]
line-length = 100
extend-exclude = ["evals/repos"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-unused-arguments
    "ARG",
    # pylint (errors & warnings)
    "PLE",
    "PLW",
    "PLC",
    # isort
    "I",
]
ignore = [
    # naming conventions live in code review, not the linter
    "N",
    # magic numbers: introducing constants for every literal is noisy here
    "PLR2004",
    # complexity limits: legacy shapes, enforced informally
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    # lazy (function-level) imports are used intentionally
    "PLC0415",
]

[build-system]
# Hatchling 1.27 emits Metadata-Version 2.5, which current twine validators reject.
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent7"]

[tool.hatch.build.targets.sdist]
include = [
    "/agent7",
    "/README.md",
    "/assets",
    "/LICENSE",
    "/pyproject.toml",
]
