[project]
name = "agent7"
version = "0.0.1"
description = "Minimal coding agent (read/write/bash/grep) for DeepSeek / Kimi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
agent7 = "agent7.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent7"]
