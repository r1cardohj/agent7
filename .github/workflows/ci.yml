name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install "ruff==0.12.12"

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

  runtime-test:
    name: runtime tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime
        run: python -m pip install -e packages/agent0-runtime

      - name: Test standalone runtime
        run: python -m unittest discover -s packages/agent0-runtime/tests -v

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/agent0-runtime
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    name: build & check dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build runtime distribution
        run: python -m build packages/agent0-runtime --outdir runtime-dist

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Twine check
        run: python -m twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install runtime-dist/*.whl
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/agent7 --help > /dev/null
          /tmp/venv/bin/python -c "import agent0_runtime; import agent7; import agent7.core; print('agent7', agent7.__version__, 'runtime', agent0_runtime.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-dist
          path: runtime-dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
